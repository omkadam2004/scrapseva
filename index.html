    <script>

        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            colors: {
              primary: {
                50: '#ecfdf5',
                100: '#d1fae5',
                200: '#a7f3d0',
                300: '#6ee7b7',
                400: '#34d399',
                500: '#10b981',
                600: '#059669',
                700: '#047857',
                800: '#065f46',
                900: '#064e3b',

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@1,600&display=swap" rel="stylesheet">
    <style>
      body { font-family: 'Inter', sans-serif; transition: background-color 0.3s ease, color 0.3s ease; }
      .font-serif-custom { font-family: 'Playfair Display', serif; }

      /* Custom scrollbar - Green Theme */
      ::-webkit-scrollbar { width: 8px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #10b981; border-radius: 10px; border: 2px solid transparent; background-clip: padding-box; }
      ::-webkit-scrollbar-thumb:hover { background: #059669; }
      
      /* Dark mode scrollbar */
      .dark ::-webkit-scrollbar-thumb { background: #34d399; border: 2px solid #09090b; }
      .dark ::-webkit-scrollbar-thumb:hover { background: #6ee7b7; }

      /* Global transitions */
      .theme-transition {
        transition: background-color 0.3s ease, border-color 0.3s ease, color 0.3s ease, box-shadow 0.3s ease;
      }

      /* Better selection colors */
      ::selection { background-color: #a7f3d0; color: #064e3b; }
      .dark ::selection { background-color: #065f46; color: #d1fae5; }
    </style>
